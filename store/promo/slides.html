<!doctype html>
<!-- Store screenshots as composed slides, 1280x800. Rendered to PNG by tools/store-assets.mjs as screenshot-1..5.png.
     ?n=1..5. Each slide is a stop on the line: a ring and headline in that stop's line colour with its rule beneath,
     the real app (captured at 2x into store/images/raw/) running off the frame, and a station-ring lens on one detail.
     The lens targets come from store/images/raw/meta.json, measured on the live app when the captures were taken. -->
<html><head><meta charset="utf-8"><title>slide</title>
<style>
  @font-face { font-family: 'Archivo'; src: url('/fonts/archivo-wdth.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
  :root {
    --ink: #16171a; --ink-2: #474a51; --ink-3: #686b73; --ground: #f2f2ef; --surface: #ffffff; --rule: #e3e3df;
    --band: #16171a; --brand: #ff5a1f; --cobalt: #2f5bd8; --magenta: #c2255c; --teal: #0b7a75; --amber: #f0a800; --green: #2f9e44; --violet: #7048e8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: var(--ground); color: var(--ink); font-family: 'Archivo', 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
  .stripe { position: absolute; left: 0; right: 0; top: 0; height: 8px; display: flex; }
  .stripe i { flex: 1; }
  /* the station sign: ring, headline and lede, with the stop's 4px rule beneath */
  .head { position: absolute; left: 64px; right: 64px; top: 54px; padding-bottom: 22px; border-bottom: 4px solid var(--l); }
  .name { display: flex; align-items: center; gap: 22px; }
  .ring { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 8px solid var(--l); background: var(--ground); }
  h1 { margin: 0; font-size: 66px; line-height: 1; font-weight: 790; font-stretch: 80%; letter-spacing: -0.03em; }
  .lede { margin: 14px 0 0 62px; max-width: 46ch; font-size: 25px; line-height: 1.35; color: var(--ink-2); }
  /* the app, in a window running off the bottom of the slide */
  .frame { position: absolute; left: 64px; top: 238px; width: 1152px; height: 640px; overflow: hidden; border-radius: 14px; border: 1px solid var(--rule); background: var(--surface); box-shadow: 0 30px 60px -20px rgba(22, 23, 26, 0.35), 0 8px 18px -6px rgba(22, 23, 26, 0.16); }
  .frame img { display: block; width: 1152px; }
  /* the lens: a station ring in the stop's colour, magnifying one detail of the same capture */
  .lens { position: absolute; width: 330px; height: 330px; border-radius: 50%; background-repeat: no-repeat; border: 10px solid var(--l); box-shadow: 0 0 0 5px var(--surface), 0 24px 48px -12px rgba(22, 23, 26, 0.45); }
  /* slide 4: the city palettes, as Settings shows them */
  .palettes { position: absolute; right: 64px; bottom: 56px; width: 470px; padding: 22px 24px 24px; border-radius: 14px; background: var(--surface); border: 1px solid var(--rule); box-shadow: 0 24px 48px -16px rgba(22, 23, 26, 0.3); }
  .palettes b { display: block; font-size: 21px; font-weight: 720; font-stretch: 85%; }
  .palettes p { margin: 4px 0 14px; color: var(--ink-3); font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 13px 0 9px; border-radius: 999px; border: 1px solid #cdcdc7; font-size: 15px; font-weight: 620; }
  .chip.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .dots { display: inline-flex; }
  .dots i { width: 13px; height: 13px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); }
  .dots i + i { margin-left: -3px; }
  /* slide 5: the privacy timetable */
  .facts { position: absolute; left: 64px; right: 64px; top: 262px; bottom: 64px; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 24px; }
  .fact { display: flex; align-items: center; gap: 26px; padding: 30px 36px; border-radius: 14px; background: var(--surface); border: 1px solid var(--rule); box-shadow: 0 1px 2px rgba(22, 23, 26, 0.06); }
  .fact .b { width: 66px; height: 66px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--band); color: #f4f3ef; }
  .fact .b svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .fact b { display: block; font-size: 29px; font-weight: 740; font-stretch: 85%; letter-spacing: -0.01em; }
  .fact span { display: block; margin-top: 8px; font-size: 20px; line-height: 1.45; color: var(--ink-2); }
</style></head>
<body>
<script type="module">
const n = +new URLSearchParams(location.search).get('n') || 1;
const meta = await (await fetch('/__store/images/raw/meta.json')).json();
const { PALETTES } = await import('/js/model.js');
const ICON = {
  lock: '<rect width="16" height="11" x="4" y="11" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  cloud: '<path d="M7 18.5h10.5a4 4 0 0 0 .4-7.98A6 6 0 0 0 6.2 9.4 4.6 4.6 0 0 0 7 18.5z"/><path d="m9.5 14 2 2 3.5-3.5"/>',
  drive: '<path d="M22 12H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><path d="M6 16h.01M10 16h.01"/>',
  download: '<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>',
};
const SLIDES = {
  1: { l: 'var(--brand)', title: 'Bookmarks on lines.', lede: 'Colour-coded lines and branches for everything you save, with icons, tags and covers.', raw: 'library', lens: [300, 590], zoom: 1.75 },
  2: { l: 'var(--cobalt)', title: 'Find anything again.', lede: 'Search the words inside every page you save, and see the passage that matched.', raw: 'search', lens: [1010, 600], zoom: 1.7 },
  3: { l: 'var(--magenta)', title: 'Keep links healthy.', lede: 'The link checker sorts dead, moved and unverified links, with one-click fixes.', raw: 'broken', lens: [1040, 610], zoom: 2.5 },
  4: { l: 'var(--teal)', title: 'Your library as a transit map.', lede: 'Every link a station in the shape of its kind, on lines coloured after your city.', raw: 'map', lens: [470, 610], zoom: 1.9, palettes: true },
  5: { l: 'var(--green)', title: 'Private by default.', lede: 'No account, no server, no tracking. Your library stays in your browser.' },
};
const s = SLIDES[n];
const FRAME = { x: 64, y: 238, scale: 1152 / meta.width };
let html = `<div class="stripe">${['var(--brand)', 'var(--cobalt)', 'var(--magenta)', 'var(--teal)', 'var(--amber)'].map((c) => `<i style="background:${c}"></i>`).join('')}</div>
  <header class="head" style="--l:${s.l}"><div class="name"><span class="ring"></span><h1>${s.title}</h1></div><p class="lede">${s.lede}</p></header>`;
if (s.raw) {
  const src = `/__store/images/raw/${s.raw}.png`, t = meta.targets[s.raw];
  // the lens shows the target point of the capture at `zoom` raw pixels per slide pixel, centred in the ring
  const D = 330 - 20, Z = s.zoom;
  const bx = -(t.x * Z - D / 2), by = -(t.y * Z - D / 2);
  html += `<div class="frame"><img src="${src}" alt=""></div>
    <div class="lens" style="--l:${s.l};left:${s.lens[0] - 165}px;top:${s.lens[1] - 165}px;background-image:url(${src});background-size:${meta.width * Z}px auto;background-position:${bx}px ${by}px"></div>`;
}
if (s.palettes) {
  const on = 'tokyo';
  html += `<div class="palettes"><b>Line colours</b><p>After a city's transit map. Switch back any time.</p><div class="chips">${PALETTES.map((p) => `<span class="chip${p.id === on ? ' on' : ''}"><span class="dots">${[3, 0, 6, 8, 1].map((i) => `<i style="background:${p.colors[i]}"></i>`).join('')}</span>${p.name}</span>`).join('')}</div></div>`;
}
if (n === 5) {
  const facts = [
    ['lock', 'Local by default', 'Bookmarks, covers and page text are stored in your browser profile, on your computer.'],
    ['cloud', 'Sync only if you want it', 'Encrypted on your device with your passphrase (AES-256) before it leaves. Google only stores scrambled data.'],
    ['drive', 'Your own Google Drive', 'Sync uses a private app folder in your Drive that your other files and apps can’t see.'],
    ['download', 'Yours to take', 'Export to HTML for any browser, or a full JSON backup, at any time.'],
  ];
  html += `<div class="facts">${facts.map(([ic, b, t]) => `<div class="fact"><span class="b"><svg viewBox="0 0 24 24">${ICON[ic]}</svg></span><div><b>${b}</b><span>${t}</span></div></div>`).join('')}</div>`;
}
document.body.insertAdjacentHTML('beforeend', html);
await document.fonts.ready;
await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
await new Promise((r) => setTimeout(r, 150));
document.title = 'ready';
</script>
</body></html>
