<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Linemark's icon: a bookmark ribbon drawn as a transit map, in line colours on a white tile. Cobalt and magenta
       edges meet the orange trunk at the top interchange and at the notch; a teal branch leaves the trunk at 45°.
       The tile fills the store's 96x96 safe area. Smaller sizes: tile-white-32.svg (32 and 48px), tile-white-16.svg. -->
  <rect x="16.5" y="16.5" width="95" height="95" rx="21.5" fill="#fff" stroke="rgba(22,23,26,0.14)"/>
  <g fill="none" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#2f5bd8" d="M64 31H54a12 12 0 0 0-12 12V99L64 77"/>
    <path stroke="#c2255c" d="M64 31H74a12 12 0 0 1 12 12V99L64 77"/>
    <path stroke="#0b7a75" d="M64 51l22 22"/>
    <path stroke="#ff5a1f" d="M64 31V77"/>
  </g>
  <g fill="#fff" stroke-width="3">
    <circle cx="42" cy="61" r="4.5" stroke="#2f5bd8"/>
    <circle cx="64" cy="51" r="4.5" stroke="#ff5a1f"/>
    <circle cx="86" cy="73" r="4.5" stroke="#c2255c"/>
  </g>
  <g fill="#fff" stroke="#16171a" stroke-width="3.25">
    <circle cx="64" cy="31" r="5.75"/>
    <circle cx="64" cy="77" r="5.75"/>
  </g>
</svg>
