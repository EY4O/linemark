  <g fill="none" stroke="#16171a" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 31H54a12 12 0 0 0-12 12V99L64 77"/>
    <path d="M64 31H74a12 12 0 0 1 12 12V99L64 77"/>
    <path d="M64 51l22 22"/>
    <path d="M64 31V77"/>
  </g>
  <g fill="#fff" stroke="#16171a" stroke-width="3">
    <circle cx="42" cy="61" r="4.5"/>
    <circle cx="64" cy="51" r="4.5"/>
