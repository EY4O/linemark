<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linemark</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="preload" href="fonts/archivo-wdth.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/theme-boot.js"></script>
</head>
<body>
  <div class="app">
    <nav class="band" id="band" aria-label="Library"></nav>
    <main class="work">
      <header class="station" id="station"></header>
      <div class="subbar" id="subbar"></div>
      <div class="content" id="content" tabindex="-1"></div>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Edit link" aria-hidden="true"></aside>
  <div class="bulk" id="bulk" role="toolbar" aria-label="Selection actions"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="sr" id="announce" role="status" aria-live="polite"></div>
  <input type="file" id="file-html" accept=".html,.htm,text/html" hidden>
  <input type="file" id="file-json" accept=".json,application/json" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
