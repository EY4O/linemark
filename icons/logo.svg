<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="32" height="32">
  <!-- Linemark at toolbar size (16 and 32px) and as the library's tab icon: the bookmark's silhouette cut
       from the family's holo gradient, with the red orb on top. The full mark is icons/linemark.svg. -->
  <defs>
    <linearGradient id="holo" gradientUnits="userSpaceOnUse" x1="120" y1="54" x2="392" y2="458"><stop offset="0" stop-color="#f7dccf"/><stop offset="0.3" stop-color="#f4a7c0"/><stop offset="0.62" stop-color="#b9a3e3"/><stop offset="1" stop-color="#8fcfe3"/></linearGradient>
    <radialGradient id="orb" cx="0.34" cy="0.3" r="0.75" fx="0.34" fy="0.3"><stop offset="0" stop-color="#fff1f1"/><stop offset="0.22" stop-color="#ffb3b3"/><stop offset="0.6" stop-color="#f26d6d"/><stop offset="1" stop-color="#c23b4a"/></radialGradient>
  </defs>
  <rect x="21" y="21" width="470" height="470" rx="103" fill="#fff" stroke="#dcdbe3" stroke-width="10"/>
  <!-- drawn 12 inside the silhouette and stroked 24 wide with round joins, which rounds every corner -->
  <path fill="url(#holo)" stroke="url(#holo)" stroke-width="24" stroke-linejoin="round" d="M134 444V154A86 86 0 0 1 220 68H292A86 86 0 0 1 378 154V444L256 331Z"/>
  <circle cx="256" cy="124" r="82" fill="#fff"/>
  <circle cx="256" cy="124" r="70" fill="url(#orb)"/>
</svg>
